<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pathogen - Deck-Building Roguelike</title>
    <meta
      name="description"
      content="Pathogen is a deck-building roguelike where you extract Essence from pathogens and survive the Specter within seven turns."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="ui.skip"></a>
    <header class="language-bar">
      <div class="header-inner">
        <a class="header-brand" href="#top" aria-label="Pathogen home"><span class="brand-mark" aria-hidden="true">✳</span> PATHOGEN</a>
        <nav class="language-list" id="languageList" aria-label="Language selector"></nav>
      </div>
    </header>

    <main id="main">
      <section id="top" class="hero" aria-labelledby="hero-title">
        <div class="hero-media" aria-hidden="true">
          <img src="assets/screenshots/English_2.png" alt="">
        </div>
        <div class="hero-shade"></div>
        <div class="hero-content">
          <p class="eyebrow" data-i18n="hero.kicker"></p>
          <h1 id="hero-title" data-i18n="hero.title"></h1>
          <p class="hero-tagline" data-i18n="hero.tagline"></p>
          <p class="hero-copy" data-i18n="hero.copy"></p>
          <div class="hero-actions">
            <a class="button steam" href="https://store.steampowered.com/app/4718090/Pathogen/" target="_blank" rel="noreferrer" data-i18n="hero.steam"></a>
            <a class="button primary" href="#trailer" data-i18n="hero.trailer"></a>
            <a class="button secondary" href="#features" data-i18n="hero.features"></a>
            <a class="button press-highlight" href="#coverage" data-i18n="hero.coverage"></a>
          </div>
          <dl class="hero-facts">
            <div>
              <dt data-i18n="facts.genre.label"></dt>
              <dd data-i18n="facts.genre.value"></dd>
            </div>
            <div>
              <dt data-i18n="facts.platform.label"></dt>
              <dd data-i18n="facts.platform.value"></dd>
            </div>
            <div>
              <dt data-i18n="facts.os.label"></dt>
              <dd data-i18n="facts.os.value"></dd>
            </div>
            <div>
              <dt data-i18n="facts.release.label"></dt>
              <dd data-i18n="facts.release.value"></dd>
            </div>
            <div>
              <dt data-i18n="facts.developer.label"></dt>
              <dd data-i18n="facts.developer.value"></dd>
            </div>
          </dl>
        </div>
      </section>

      <section id="trailer" class="section-inner trailer-layout" aria-labelledby="trailer-title">
        <div>
          <p class="eyebrow" data-i18n="trailerSection.kicker"></p>
          <h2 id="trailer-title" data-i18n="trailerSection.title"></h2>
          <p data-i18n="trailerSection.body"></p>
        </div>
        <div class="trailer-media">
          <div class="video-frame">
            <iframe data-youtube-id="dKhnJV5NCgE" title="Pathogen trailer" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          </div>
          <a class="trailer-external" href="https://youtu.be/dKhnJV5NCgE" target="_blank" rel="noreferrer" data-i18n="trailerSection.link"></a>
        </div>
      </section>

      <section class="intro">
        <div class="section-inner intro-grid">
          <div>
            <p class="eyebrow" data-i18n="overview.kicker"></p>
            <h2 data-i18n="overview.title"></h2>
          </div>
          <div class="intro-copy">
            <p data-i18n="overview.body1"></p>
            <p data-i18n="overview.body2"></p>
          </div>
        </div>
      </section>

      <section class="gallery section-band" aria-labelledby="gallery-title">
        <div class="section-inner">
          <div class="section-heading compact">
            <p class="eyebrow" data-i18n="gallery.kicker"></p>
            <h2 id="gallery-title" data-i18n="gallery.title"></h2>
            <p data-i18n="gallery.hint"></p>
          </div>
          <div class="gallery-grid" id="galleryGrid"></div>
        </div>
      </section>

      <section id="features" class="section-band feature-band" aria-labelledby="features-title">
        <div class="section-inner">
          <div class="section-heading">
            <p class="eyebrow" data-i18n="features.kicker"></p>
            <h2 id="features-title" data-i18n="features.title"></h2>
            <p data-i18n="features.subtitle"></p>
          </div>
          <div class="feature-highlights" id="featureHighlights"></div>
          <div class="feature-grid" id="featureGrid"></div>
        </div>
      </section>

      <section class="press section-band" aria-labelledby="press-title">
        <div class="section-inner press-layout">
          <div>
            <p class="eyebrow" data-i18n="press.kicker"></p>
            <h2 id="press-title" data-i18n="press.title"></h2>
            <p data-i18n="press.intro"></p>
          </div>
          <div class="press-copy">
            <button class="icon-button" id="copyPress" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M8 8h11v11H8z"></path>
                <path d="M5 16H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h11a1 1 0 0 1 1 1v1"></path>
              </svg>
              <span data-copy-label data-i18n="press.button"></span>
            </button>
            <div class="press-body" id="pressText"></div>
          </div>
        </div>
      </section>
    </main>

    <section id="coverage" class="coverage" aria-labelledby="coverage-title">
      <div class="coverage-inner">
        <h2 id="coverage-title" data-i18n="coverage.title"></h2>
        <div class="coverage-links">
          <a href="https://www.gamemeca.com/view.php?gid=1777944" target="_blank" rel="noreferrer" data-i18n="coverage.items.0"></a>
          <a href="https://dpg.danawa.com/mobile/news/view?boardSeq=60&listSeq=6027862" target="_blank" rel="noreferrer" data-i18n="coverage.items.1"></a>
          <a href="https://www.inven.co.kr/webzine/news/?news=317863" target="_blank" rel="noreferrer" data-i18n="coverage.items.2"></a>
          <a href="https://gamefocus.co.kr/detail.php?number=177043" target="_blank" rel="noreferrer" data-i18n="coverage.items.3"></a>
        </div>
      </div>
    </section>

    <div class="image-modal" id="imageModal" aria-hidden="true">
      <div class="image-modal-panel" role="dialog" aria-modal="true">
        <button class="modal-close" id="modalClose" type="button">×</button>
        <img id="modalImage" alt="">
        <p id="modalCaption"></p>
      </div>
    </div>

    <footer class="footer">
      <span>Copyright 2026. Dreamdart All rights reserved.</span>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
